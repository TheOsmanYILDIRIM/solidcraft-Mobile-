# Fork Pages: use verified upstream SolidCraft web artifacts, not local Rust builds.
name: Pages

on:
  push:
    branches: [main]
    paths-ignore: ["tests/**", "scripts/claim/**", "scripts/triage/**"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Upstream stable release tag (empty: latest stable)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download and verify the upstream CAD web release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag || '' }}
        shell: bash
        run: |
          set -euo pipefail
          upstream="tangency-labs/solidcraft"
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then
            tag="$(gh api "repos/$upstream/releases/latest" --jq '.tag_name')"
          fi
          test -n "$tag"
          zip="solidcraft-web-${tag#v}.zip"
          mkdir -p "$RUNNER_TEMP/solidcraft-download" "$RUNNER_TEMP/solidcraft-unpacked"
          gh release download "$tag" --repo "$upstream" --dir "$RUNNER_TEMP/solidcraft-download" --pattern "$zip"
          gh release download "$tag" --repo "$upstream" --dir "$RUNNER_TEMP/solidcraft-download" --pattern SHA256SUMS.txt
          cd "$RUNNER_TEMP/solidcraft-download"
          expected="$(awk -v file="$zip" '$2 == file || $2 == "*"file { print $1; found=1; exit } END { if (!found) exit 1 }' SHA256SUMS.txt)"
          printf '%s  %s\n' "$expected" "$zip" | sha256sum --check --status
          unzip -q "$zip" -d "$RUNNER_TEMP/solidcraft-unpacked"
          entry="$(find "$RUNNER_TEMP/solidcraft-unpacked" -maxdepth 3 -type f -name index.html -print -quit)"
          test -n "$entry"
          source_dir="$(dirname "$entry")"
          test -s "$source_dir/sw.js"
          test -s "$source_dir/index.html"
          cd "$GITHUB_WORKSPACE"
          mkdir -p site/app-edge site/app site/mobile site/guide site/docs
          cp -a "$source_dir"/. site/app-edge/
          cp -a "$source_dir"/. site/app/
          cp mobile/index.html mobile/app.js site/mobile/
          printf '%s\n' "$tag" > site/UPSTREAM_RELEASE.txt
          echo "Upstream web release: $tag"
          echo "Verified SHA256: $expected"
      - name: Open the CAD app and link upstream documentation
        shell: bash
        run: |
          set -euo pipefail
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta http-equiv="refresh" content="0;url=app-edge/">
          <title>SolidCraft CAD</title>
          <script>location.replace(new URL("app-edge/" + location.search + location.hash, location.href));</script>
          </head>
          <body><p><a href="app-edge/">Open CAD</a> · <a href="mobile/">Mobile interface</a> · <a href="https://docs.solidcraft.io/">Documentation</a></p></body>
          </html>
          HTML
          cat > site/guide/index.html <<'HTML'
          <!doctype html><html lang="en"><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=https://docs.solidcraft.io/"><title>SolidCraft docs</title><p><a href="https://docs.solidcraft.io/">Open official documentation</a></p></html>
          HTML
          cp site/guide/index.html site/docs/index.html
          test -s site/app-edge/index.html
          test -s site/mobile/app.js
          grep -q 'app-edge/' site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
